name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # 배포할 기준 브랜치 이름

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-packages: 'npm'
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite 빌드 결과물 폴더 (프로젝트 환경에 따라 build 등으로 변경 가능)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
